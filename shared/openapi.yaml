          type: string
          description: Card-relative path; backslashes are normalised
        size:
          type: integer
          format: int64
          minimum: 0
        xxh64:
          type: string
        sha256:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
        mime:
          type: string
        width:
          type: integer
        height:
          type: integer
        captured_at:
          type: string
          format: date-time
          nullable: true

          type: string
          description: |
            Current ingest state. A duplicated entry with status uploaded or
            verified needs no upload; registered/missing/corrupt still do.
          enum: [registered, uploaded, verified, missing, corrupt]

    RegisterResult:
      type: object
      properties:
        accepted:
          type: integer
        inserted:
          type: integer
        duplicated:
          type: integer
        assets:
          type: array
          items:
            $ref: "#/components/schemas/AssetResult"

    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          example: ingest.verify
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        subject_type:
          type: string
        subject_id:
          type: string
          format: uuid
          nullable: true
        attempts:
          type: integer
        max_attempts:
          type: integer
        payload:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true
          nullable: true
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true

    JobList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"

    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        filename:
          type: string
        content_hash:
          type: string
        original_key:
          type: string
        size_bytes:
          type: integer
          format: int64
        mime:
          type: string
        width:
          type: integer
        height:
          type: integer
        status:
          type: string
          enum:
            - registered
            - uploaded
            - verified
            - derivative_ready
            - culled
            - selected
            - retouching
            - proofing
            - approved
            - delivered
            - archived
            - missing
            - corrupt
            - quarantined
            - integration_failed
        is_video:
          type: boolean
        created_at:
          type: string
          format: date-time

    AssetList:
      type: object
      properties:

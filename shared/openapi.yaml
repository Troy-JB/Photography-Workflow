      properties:
        asset_id:
          type: string
          format: uuid
        filename:
          type: string
        position:
          type: integer
        decision:
          type: string
          enum: [selected, rejected]
        decided_at:
          type: string
          format: date-time

    GalleryDetail:
      allOf:
        - $ref: "#/components/schemas/Gallery"
        - type: object
          properties:
            counts:
              $ref: "#/components/schemas/SelectionCounts"
            tokens:
              type: array
              items:
                $ref: "#/components/schemas/GalleryToken"
            selections:
              type: array
              items:
                $ref: "#/components/schemas/GallerySelection"

    GalleryAsset:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
        filename:
          type: string
        position:
          type: integer
        width:
          type: integer
        height:
          type: integer
        is_video:
          type: boolean
        decision:
          type: string
          enum: [none, selected, rejected]
        preview_ready:
          type: boolean
          description: Thumb and display derivatives exist for the current watermark
        thumb_url:
          type: string
          description: Short-lived presigned URL; empty when the thumb is missing
        lqip:
          type: string
          description: data URL placeholder
        color:
          type: string
        derive_error:
          type: string
          description: Last derivation failure, if any

    DerivativeSummary:
      type: object
      properties:
        missing:
          type: integer
          description: Assets without a publishable thumb/display pair
        failed:
          type: integer
          description: Missing assets whose last derivation attempt failed

    GalleryAssets:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GalleryAsset"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        derivatives:
          $ref: "#/components/schemas/DerivativeSummary"

    CandidateAsset:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
        filename:
          type: string
        width:
          type: integer
        height:
          type: integer
        is_video:
          type: boolean
        status:
          type: string
        in_gallery:
          type: boolean
        preview_ready:
          type: boolean
        thumb_url:
          type: string
        lqip:
          type: string
        color:
          type: string

    CandidatePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CandidateAsset"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    GalleryCreateRequest:
      type: object
      required: [project_id, title]
      properties:
        project_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        expires_at:
          type: string
          format: date-time
        selection_limit:
          type: integer
          nullable: true
          minimum: 0
        download_allowed:
          type: boolean
        watermark_text:
          type: string
          maxLength: 120

    GalleryUpdateRequest:
      type: object
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          minimum: 0
        title:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        selection_limit:
          type: integer
          nullable: true
        download_allowed:
          type: boolean
        watermark_text:
          type: string
          description: Draft only; published galleries keep their rendered watermark

    GalleryAttachRequest:
      type: object
      required: [asset_ids]
      properties:
        asset_ids:
          type: array
          items:
            type: string
            format: uuid

    GalleryAssetChange:
      type: object
      properties:
        gallery:
          $ref: "#/components/schemas/Gallery"
        added:
          type: integer
        skipped:
          type: integer

    GalleryTokenCreateRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 80
        max_visits:
          type: integer
          minimum: 0
          maximum: 100000
          description: 0 means unlimited
        expires_at:
          type: string
          format: date-time

    DeriveRequest:
      type: object
      properties:
        asset_ids:
          type: array
          description: Empty means every asset in the project that needs previews
          items:
            type: string
            format: uuid
        force:
          type: boolean
          description: Re-render even complete derivatives (e.g. after a watermark change)

    DeriveResult:
      type: object
      properties:
        candidates:
          type: integer
        watermark:
          type: string
        force:
          type: boolean

    DerivativePresignRequest:
      type: object
      required: [asset_id, kind, size, sha256]
      properties:
        asset_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [gallery]
        size:
          type: integer
          format: int64
          maximum: 16777216
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"

    DerivativePresign:
      type: object
      properties:
        key:
          type: string
        url:
          type: string
        expires_at:
          type: string
          format: date-time

    DerivativeCompleteRequest:
      type: object
      required: [kind, size, sha256]
      properties:
        kind:
          type: string
          enum: [gallery]
        size:
          type: integer
          format: int64
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        width:
          type: integer
        height:
          type: integer

    Derivative:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [gallery]
        key:
          type: string
        width:
          type: integer
        height:
          type: integer
        bytes:
          type: integer
          format: int64
        status:
          type: string

    GallerySessionRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          maxLength: 200
          description: Plaintext share token from the URL fragment

    GalleryAlbum:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        title:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        selection_limit:
          type: integer
          nullable: true
        download_allowed:
          type: boolean
          description: Displayed as information; downloads ship in the delivery milestone
        submitted_at:
          type: string
          format: date-time
          nullable: true
        first_submitted_at:
          type: string
          format: date-time
          nullable: true
        selection_edit_until:
          type: string
          format: date-time
          nullable: true
        selection_locked_at:
          type: string
          format: date-time
          nullable: true
        included_retouch_count:
          type: integer
        extra_retouch_unit_price_cents:
          type: integer
        charge_batch_id:
          type: string
          format: uuid
          nullable: true
        charge_amount_cents:
          type: integer
        payment_url:
          type: string
          format: uri
        payment_order_id:
          type: string
          format: uuid
        selection_version:
          type: integer
        counts:
          $ref: "#/components/schemas/SelectionCounts"

    GallerySession:
      type: object
      properties:
        session:
          type: string
          description: Bearer token for the gallery endpoints (2h, capped at token expiry)
        expires_at:
          type: string
          format: date-time
        album:
          $ref: "#/components/schemas/GalleryAlbum"

    ManifestAssetItem:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
        filename:
          type: string
        position:
          type: integer
        width:
          type: integer
        height:
          type: integer
        is_video:
          type: boolean
        thumb_url:
          type: string
          description: Presigned thumb (no watermark)
        display_url:
          type: string
          description: Presigned watermarked display image
        lqip:
          type: string
        color:
          type: string
        decision:
          type: string
          enum: [none, selected, rejected]

    ManifestPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ManifestAssetItem"
        next_cursor:
          type: string
          description: Absent on the last page
        selection_version:
          type: integer

    SelectionItem:
      type: object
      required: [asset_id, decision]
      properties:
        asset_id:
          type: string
          format: uuid
        decision:
          type: string
          enum: [selected, rejected, none]

    SelectionBatchRequest:
      type: object
      required: [expected_version, items]
      properties:
        expected_version:
          type: integer
          minimum: 0
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/SelectionItem"

    SelectionBatchResult:
      type: object
      properties:
        selection_version:
          type: integer
        counts:
          $ref: "#/components/schemas/SelectionCounts"
        payment_url:
          type: string
          description: Present when the customer submits choices with new extra images.
        payment_order_id:
          type: string
          format: uuid
        charge_amount_cents:
          type: integer

    SelectionSubmitRequest:
      type: object
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          minimum: 0

    # --------------------------------------------------------- proof

    ProofRound:
      type: object
      required: [id, project_id, gallery_id, round_no, status, due_at, version]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        gallery_id:
          type: string
          format: uuid
        round_no:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [open, in_review, changes_requested, retouching, resubmitted, approved]
        due_at:
          type: string
          format: date-time
        viewed_at:
          type: string
          format: date-time
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        change_order_id:
          type: string
          format: uuid
          nullable: true
          description: Applied extra_retouch change order that funds this round, if any.
        override_by:
          type: string
          format: uuid
          nullable: true
        override_reason:
          type: string
        client_email:
          type: string
          description: Recipient snapshot used by proof invitations.
        version:
          type: integer
          minimum: 1
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProofRoundSummary:
      allOf:
        - $ref: "#/components/schemas/ProofRound"
        - type: object
          properties:
            asset_count:
              type: integer
            comment_count:
              type: integer
            open_comments:
              type: integer

    ProofRoundItem:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
        filename:
          type: string
        position:
          type: integer
        width:
          type: integer
        height:
          type: integer
        is_video:
          type: boolean
        revision_id:
          type: string
          format: uuid
          nullable: true
        revision_no:
          type: integer
          description: 0 when the item still shows the original preview.
        revision_state:
          type: string
          enum: [uploaded, derivative_ready, failed]
        revision_created_at:
          type: string
          format: date-time
          nullable: true
        thumb_url:
          type: string
          description: Presigned thumb (no watermark)
        display_url:
          type: string
          description: Presigned watermarked display image
        comments:
          type: integer
        open_comments:
          type: integer

    RetouchTaskSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, in_progress, delivered, cancelled]
        provider:
          type: string
          enum: [manual, folder_watch]
        due_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true

    ProofRoundDetail:
      allOf:
        - $ref: "#/components/schemas/ProofRound"
        - type: object
          properties:
            asset_count:
              type: integer
            comment_count:
              type: integer
            open_comments:
              type: integer
            items:
              type: array
              items:
                $ref: "#/components/schemas/ProofRoundItem"
            tokens:
              type: array
              items:
                $ref: "#/components/schemas/ProofToken"
            retouch:
              $ref: "#/components/schemas/RetouchTaskSummary"

    ProofToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        max_visits:
          type: integer
          description: 0 means unlimited
        visits:
          type: integer
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    IssuedProofToken:
      allOf:
        - $ref: "#/components/schemas/ProofToken"
        - type: object
          properties:
            token:
              type: string
              description: Plaintext link token; only its SHA-256 is stored, so it cannot be recovered.
            proof_url:
              type: string
              description: Customer URL (`<public_base_url>/#/p/<token>`); the token stays in the fragment.

    ProofInvitation:
      type: object
      properties:
        token:
          type: string
        proof_url:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true

    CreatedProofRound:
      type: object
      properties:
        round:
          $ref: "#/components/schemas/ProofRound"
        token:
          $ref: "#/components/schemas/IssuedProofToken"
        items:
          type: integer

    ProofComment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        proof_round_id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        author_type:
          type: string
          enum: [client, staff]
        author_user_id:
          type: string
          format: uuid
          nullable: true
        client_ref:
          type: string
          description: Idempotency-Key supplied by the customer client.
        body:
          type: string
          maxLength: 2000
        annotation:
          $ref: "#/components/schemas/Annotation"
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolved_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AnnotationPoint:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1

    Annotation:
      type: object
      required: [schema, type, points]
      description: |
        Normalized coordinates (0–1 of the rendered image) so the same
        annotation maps onto the original and every retouched revision.
        `point` carries exactly 1 point, `rect`/`ellipse` exactly 2 with
        x1 < x2 and y1 < y2, `freehand` 2–256 points. At most 16 KiB.
      properties:
        schema:
          type: string
          enum: [annotation.v1]
        type:
          type: string
          enum: [point, rect, ellipse, freehand]
        points:
          type: array
          minItems: 1
          maxItems: 256
          items:
            $ref: "#/components/schemas/AnnotationPoint"
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}([0-9A-Fa-f]{2})?$'

    CustomerProofRound:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        gallery_id:
          type: string
          format: uuid
        round_no:
          type: integer
        status:
          type: string
          enum: [open, in_review, changes_requested, retouching, resubmitted, approved]
        due_at:
          type: string
          format: date-time
        version:
          type: integer
        project_title:
          type: string
        gallery_title:
          type: string

    ProofSessionRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          maxLength: 200

    ProofSessionView:
      type: object
      properties:
        session:
          type: string
          description: Bearer token for the `proofSession` scheme.
        expires_at:
          type: string
          format: date-time
        round:
          $ref: "#/components/schemas/CustomerProofRound"

    ProofManifestItem:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
        filename:
          type: string
        position:
          type: integer
        width:
          type: integer
        height:
          type: integer
        is_video:
          type: boolean
        thumb_url:
          type: string
        display_url:
          type: string
        lqip:
          type: string
        color:
          type: string
        revision_id:
          type: string
          format: uuid
          nullable: true
        revision_no:
          type: integer
          description: Non-zero marks the retouched version shown to the customer.
        comments:
          type: integer

    ProofManifestPage:
      type: object
      properties:
        round:
          $ref: "#/components/schemas/CustomerProofRound"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProofManifestItem"
        total:
          type: integer
        limit:
          type: integer
        next_cursor:
          type: string
          description: Absent on the last page

    CreateProofRoundRequest:
      type: object
      required: [project_id, gallery_id, due_at]
      properties:
        project_id:
          type: string
          format: uuid
        gallery_id:
          type: string
          format: uuid
        due_at:
          type: string
          format: date-time
          description: Must be in the future (at most 180 days).
        asset_ids:
          type: array
          description: Subset of the selected assets; empty means every selected asset.
          items:
            type: string
            format: uuid

    ExtendProofRoundRequest:
      type: object
      required: [expected_version, due_at]
      properties:
        expected_version:
          type: integer
          minimum: 1
        due_at:
          type: string
          format: date-time

    IssueProofTokenRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 100
        max_visits:
          type: integer
          minimum: 0
        expires_at:
          type: string
          format: date-time
          nullable: true

    NotifyProofRequest:
      type: object
      properties:
        channel:
          type: string
          enum: [email, sms]
          default: email

    CreateProofCommentRequest:
      type: object
      required: [asset_id]
      properties:
        asset_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        body:
          type: string
          maxLength: 2000
        annotation:
          $ref: "#/components/schemas/Annotation"

    SubmitProofRequest:
      type: object
      required: [decision, expected_version]
      properties:
        decision:
          type: string
          enum: [approved, changes_requested]
        expected_version:
          type: integer
          minimum: 1

    Revision:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        revision_no:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        size_bytes:
          type: integer
        width:
          type: integer
        height:
          type: integer
        status:
          type: string
          enum: [uploaded, derivative_ready, failed]
        note:
          type: string
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    ImportedRevision:
      allOf:
        - $ref: "#/components/schemas/Revision"
        - type: object
          properties:
            duplicate:
              type: boolean
              description: True when the checksum already existed; the stored revision is returned.

    RevisionUpload:
      type: object
      required: [asset_id, file]
      properties:
        asset_id:
          type: string
          format: uuid
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Declared checksum; the server re-hashes the stream and rejects a mismatch.
        size:
          type: integer
          description: Declared byte size; defaults to the uploaded file size.
        width:
          type: integer
        height:
          type: integer
        note:
          type: string
          maxLength: 500
        file:
          type: string
          format: binary
          description: JPEG, PNG or WebP, at most 50 MiB.

    # --------------------------------------------------------- integration

    IntegrationJobError:
      type: object
      properties:
        retouch_task_id:
          type: string
          format: uuid
        direction:
          type: string
          enum: [export, import]
        attempts:
          type: integer
        last_error:
          type: string
        updated_at:
          type: string
          format: date-time

    IntegrationStatus:
      type: object
      properties:
        provider:
          type: string
          enum: [manual, folder_watch]
        root:
          type: string
          description: FolderWatch root directory; absent for the manual provider.
        exports:
          type: object
          additionalProperties:
            type: integer
        imports:
          type: object
          additionalProperties:
            type: integer
        active_tasks:
          type: integer
        overdue_tasks:
          type: integer
        recent_errors:
          type: array
          items:
            $ref: "#/components/schemas/IntegrationJobError"

    DeliveryStatus:
      type: string
      enum: [pending, building, ready, failed, blocked]

    DeliverySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        proof_round_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        build_version:
          type: integer
          minimum: 1
        item_count:
          type: integer
        total_bytes:
          type: integer
          format: int64
        blocked_reason:
          type: string
          description: Set to payment_required when a refund blocked the delivery.
        last_error:
          type: string
        ready_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        project_code:
          type: string
        project_title:
          type: string
        round_no:
          type: integer
        payment_status:
          type: string
          description: Mirror of projects.payment_status; build and download require paid.
        project_state:
          type: string

    DeliveryPackage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        spec:
          type: string
          enum: [web, original]
        version:
          type: integer
        status:
          type: string
          enum: [pending, building, ready, failed]
        object_key:
          type: string
        file_name:
          type: string
        size_bytes:
          type: integer
          format: int64
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        entry_count:
          type: integer
        last_error:
          type: string
        built_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    DeliveryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        position:
          type: integer
        original_name:
          type: string
        original_mime:
          type: string
        original_size:
          type: integer
          format: int64
        original_sha256:
          type: string
        revision_id:
          type: string
          format: uuid
          nullable: true
        revision_no:
          type: integer
          description: Non-zero means the retouched revision replaced the original.
        web_name:
          type: string
        web_size:
          type: integer
          format: int64
        web_sha256:
          type: string
        web_width:
          type: integer
        web_height:
          type: integer
        web_status:
          type: string
          enum: [pending, ready, skipped]
        web_warning_code:
          type: string
          description: web_spec_unsupported_mime or web_spec_decode_failed.
        web_warning:
          type: string

    DeliveryItemsPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryItem"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    DeliveryWarning:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        count:
          type: integer

    DeliveryToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        recipient:
          type: string
        max_downloads:
          type: integer
        downloads:
          type: integer
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        last_used_ip:
          type: string
        created_at:
          type: string
          format: date-time

    DeliveryTokenIssued:
      allOf:
        - $ref: "#/components/schemas/DeliveryToken"
        - type: object
          properties:
            token:
              type: string
              description: Plaintext link token; the only time it is returned.
            url:
              type: string
              description: Customer link with the token in the URL fragment.

    DeliveryDetail:
      allOf:
        - $ref: "#/components/schemas/DeliverySummary"
        - type: object
          properties:
            packages:
              type: array
              items:
                $ref: "#/components/schemas/DeliveryPackage"
            tokens:
              type: array
              items:
                $ref: "#/components/schemas/DeliveryToken"
            warnings:
              type: array
              items:
                $ref: "#/components/schemas/DeliveryWarning"
            web_ready:
              type: integer
            web_skipped:
              type: integer
            web_pending:
              type: integer

    ArchiveSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        project_code:
          type: string
        project_title:
          type: string
        project_state:
          type: string
        status:
          type: string
          enum: [pending, verifying, ready, failed, deleting, deleted]
        version:
          type: integer
        object_count:
          type: integer
        verified_count:
          type: integer
        failed_count:
          type: integer
        total_bytes:
          type: integer
          format: int64
        keep_days:
          type: integer
        warn_days:
          type: integer
        retention_until:
          type: string
          format: date-time
          nullable: true
        warned_at:
          type: string
          format: date-time
          nullable: true
        verified_at:
          type: string
          format: date-time
          nullable: true
        deletion_requested_at:
          type: string
          format: date-time
          nullable: true
        confirmed_by:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
        deleted_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ArchiveItem:
      type: object
      description: |
        One snapshot object. `missing` and `mismatch` are verification failures;
        the object key is shown to staff so a failure can be investigated.
      properties:
        id:
          type: string
          format: uuid
        archive_id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
          nullable: true
        kind:
          type: string
          enum: [original, derivative, revision, revision_derivative, delivery_web,
                 delivery_package, contract_document, contract_signed, invoice_file]
        object_key:
          type: string
        expected_sha256:
          type: string
        expected_size:
          type: integer
          format: int64
        actual_sha256:
          type: string
        actual_size:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, verified, missing, mismatch, deleted]
        note:
          type: string
        checked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    ArchiveDetail:
      allOf:
        - $ref: "#/components/schemas/ArchiveSummary"
        - type: object
          properties:
            items:
              type: array
              description: First snapshot page; use the items endpoint to page.
              items:
                $ref: "#/components/schemas/ArchiveItem"

    ArchiveItemsPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArchiveItem"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    ArchiveListPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArchiveSummary"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    CreateArchiveRequest:
      type: object
      required: [project_id]
      properties:
        project_id:
          type: string
          format: uuid
          description: Project in the archived state.

    ArchiveDeletionRequest:
      type: object
      required: [confirm, reason]
      properties:
        confirm:
          type: string
          enum: [DELETE]
          description: Literal confirmation word; anything else is rejected.
        reason:
          type: string
          minLength: 1
          maxLength: 500

    RetentionPolicy:
      type: object
      properties:
        keep_days:
          type: integer
        warn_days:
          type: integer
        updated_by:
          type: string
          format: uuid
          nullable: true
        updated_at:
          type: string
          format: date-time

    RetentionPolicyRequest:
      type: object
      required: [keep_days, warn_days]
      properties:
        keep_days:
          type: integer
          minimum: 1
          maximum: 3650
        warn_days:
          type: integer
          minimum: 0
          description: Must be strictly less than keep_days.

    CreateDeliveryRequest:
      type: object
      required: [proof_round_id]
      properties:
        proof_round_id:
          type: string
          format: uuid
          description: Approved proof round to deliver.

    IssueDownloadTokenRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 80
        recipient:
          type: string
          maxLength: 200
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 30
          description: Defaults to 14 days and is capped by delivery.max_token_ttl.
        max_downloads:
          type: integer
          minimum: 1
          maximum: 100
          description: Defaults to delivery.max_downloads (20).

    NotifyDeliveryRequest:
      type: object
      properties:
        recipient:
          type: string
          maxLength: 200
          description: Defaults to the project client's email.

    DeliveryNotifyResult:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
        token_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time

    DeliverySessionRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 20
          description: Plaintext token from the `/#/d/<token>` fragment.

    DeliverySessionView:
      type: object
      properties:
        session:
          type: string
          description: Bearer token for the `deliverySession` scheme.
        expires_at:
          type: string
          format: date-time
        delivery:
          $ref: "#/components/schemas/CustomerDelivery"

    CustomerDeliveryPackage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        spec:
          type: string
          enum: [web, original]
        file_name:
          type: string
        size_bytes:
          type: integer
          format: int64
        entry_count:
          type: integer

    CustomerDeliveryItem:
      type: object
      description: |
        One delivered file as shown to the customer. Original object URLs never
        appear here; a download grant is required to fetch the bytes.
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        file_name:
          type: string
        original_size:
          type: integer
          format: int64
        revision_no:
          type: integer
          description: Non-zero means the retouched revision replaced the original.
        web_available:
          type: boolean
          description: False when the web spec was skipped (for example RAW or HEIC sources).
        web_width:
          type: integer
        web_height:
          type: integer
        web_size:
          type: integer
          format: int64
        thumb_url:
          type: string
          description: Short-lived presigned thumbnail URL.

    CustomerDeliveryItemsPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerDeliveryItem"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    CustomerDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_title:
          type: string
        round_no:
          type: integer
        item_count:
          type: integer
        downloads_remaining:
          type: integer
        expires_at:
          type: string
          format: date-time
        web_ready:
          type: integer
        web_skipped:
          type: integer
        packages:
          type: array
          items:
            $ref: "#/components/schemas/CustomerDeliveryPackage"

    DeliveryDownloadRequest:
      type: object
      properties:
        package_id:
          type: string
          format: uuid
          description: Download a whole ZIP; takes precedence over item_id.
        item_id:
          type: string
          format: uuid
        spec:
          type: string
          enum: [web, original]
          description: Required with item_id.

    DeliveryDownloadGrant:
      type: object
      properties:
        url:
          type: string
          description: Presigned URL; expires after delivery.presign_ttl.
        file_name:
          type: string
        expires_at:
          type: string
          format: date-time
        downloads_remaining:
          type: integer

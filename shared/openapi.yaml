openapi: 3.0.3
info:
  title: Photography Workflow API
  version: 0.1.0
  description: |
    Contract for the photographer commercial workflow platform.

    - `/api/v1` 后台 API（JWT）
    - `/agent/v1` 本地采集 Agent API（M0 复用同一 JWT，后续切换为设备令牌）
    - `/g/v1` 客户选片 API（分享链接换取的 2h 会话，无用户 JWT）
    - `/c/v1` 客户中心 API（微信身份、手机号授权、摄影师邀请与预约）
    - 图片字节不经过 API：客户端使用预签名 URL 直传对象存储
tags:
  - name: health
  - name: auth
  - name: projects
  - name: clients
  - name: leads
  - name: quotes
  - name: contracts
  - name: esign
  - name: payments
  - name: invoices
  - name: change-orders
  - name: schedule
  - name: payment-alerts
  - name: ingest
  - name: shoot-prep
  - name: notifications
  - name: gallery
  - name: customer
  - name: proof
  - name: delivery
  - name: archive
  - name: integration

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness and dependency probe
      security: []
      responses:
        "200":
          description: All dependencies reachable
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "503":
          description: At least one dependency is down
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Create a user, studio and owner session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Studio created and session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "409":
          description: Email already registered
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Exchange email and password for a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Revoked

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Current user and tenant
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/projects:
    get:
      tags: [projects]
      summary: List projects
      parameters:
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/ProjectState"
        - name: exclude_closed
          in: query
          description: Exclude cancelled/archived projects and legacy projects with only cancelled bookings; intended for new-work selectors.
          schema:
            type: boolean
            default: false
        - name: exclude_closed
          in: query
          description: Exclude cancelled/archived projects and legacy projects whose only bookings are cancelled. Intended for new-work selectors.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Project page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [projects]
      summary: Create a project in draft state
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/projects/{projectID}:
    get:
      tags: [projects]
      summary: Get a project
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workflow:
    get:
      tags: [projects]
      summary: List customer workflow summaries
      description: Derives the six-stage customer-facing workflow from current project, booking, payment, gallery, proof and delivery data; no aggregate status is persisted.
      parameters:
        - name: stage
          in: query
          schema:
            type: string
            enum: [not_shot, shooting, originals_delivery, selecting, retouch_delivery, completed, cancelled]
      responses:
        "200": { description: Workflow rows with client, cover, payment, booking and derived stage fields }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/workbench:
    get:
      tags: [projects]
      summary: Load workbench projects and schedule data
      responses:
        "200": { description: Same workflow projection used by the customer list and detail page }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/projects/{projectID}/transitions:
    post:
      tags: [projects]
      summary: Move a project along the order state machine
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/projects/{projectID}/assets:
    get:
      tags: [projects]
      summary: List assets registered for a project
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Asset page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/clients:
    get:
      tags: [clients]
      summary: List clients
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Client page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [clients]
      summary: Create a client
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/clients/{clientID}:
    get:
      tags: [clients]
      summary: Get a client
      parameters:
        - $ref: "#/components/parameters/ClientID"
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [clients]
      summary: Update a client with optimistic locking
      parameters:
        - $ref: "#/components/parameters/ClientID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientRequest"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/leads:
    get:
      tags: [leads]
      summary: List leads
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/LeadStatus"
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Lead page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [leads]
      summary: Create a lead
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/leads/{leadID}:
    get:
      tags: [leads]
      summary: Get a lead
      parameters:
        - $ref: "#/components/parameters/LeadID"
      responses:
        "200":
          description: Lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [leads]
      summary: Update a lead with optimistic locking
      parameters:
        - $ref: "#/components/parameters/LeadID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadRequest"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/leads/{leadID}/transitions:
    post:
      tags: [leads]
      summary: Move a lead along its pipeline
      parameters:
        - $ref: "#/components/parameters/LeadID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadTransitionRequest"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/leads/{leadID}/follow-ups:
    get:
      tags: [leads]
      summary: List follow-up records
      parameters:
        - $ref: "#/components/parameters/LeadID"
      responses:
        "200":
          description: Follow-ups, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FollowUp"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [leads]
      summary: Record a follow-up and schedule the next one
      parameters:
        - $ref: "#/components/parameters/LeadID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowUpRequest"
      responses:
        "201":
          description: Created follow-up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUp"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/leads/{leadID}/convert:
    post:
      tags: [leads]
      summary: Convert a lead into a client and/or project
      description: |
        Runs atomically: reuses or creates the client, links or creates the
        project, then marks the lead converted. A project is created unless
        project_id is supplied or create_project is false.
      parameters:
        - $ref: "#/components/parameters/LeadID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvertLeadRequest"
      responses:
        "200":
          description: Converted lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/projects/{projectID}/brief:
    get:
      tags: [projects]
      summary: Read the project brief
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [projects]
      summary: Create or update the project brief
      description: |
        expected_version 0 creates the brief; later writes must pass the
        version returned by the previous read/write.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertBriefRequest"
      responses:
        "200":
          description: Saved brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/quotes:
    get:
      tags: [quotes]
      summary: List quotes
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/QuoteStatus"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Quote page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [quotes]
      summary: Create a draft quote version
      description: Only one draft may exist per project. Amounts are computed server-side.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteRequest"
      responses:
        "201":
          description: Created draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/quotes/{quoteID}:
    get:
      tags: [quotes]
      summary: Get a quote with line items
      parameters:
        - $ref: "#/components/parameters/QuoteID"
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [quotes]
      summary: Replace a draft quote
      parameters:
        - $ref: "#/components/parameters/QuoteID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuoteRequest"
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/quotes/{quoteID}/send:
    post:
      tags: [quotes]
      summary: Freeze a draft quote and send it
      description: Sends the quote, freezes its snapshot and supersedes prior sent/accepted versions.
      parameters:
        - $ref: "#/components/parameters/QuoteID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
      responses:
        "200":
          description: Sent quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/quotes/{quoteID}/accept:
    post:
      tags: [quotes]
      summary: Accept a sent quote
      parameters:
        - $ref: "#/components/parameters/QuoteID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
      responses:
        "200":
          description: Accepted quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/quotes/{quoteID}/reject:
    post:
      tags: [quotes]
      summary: Reject a sent quote
      parameters:
        - $ref: "#/components/parameters/QuoteID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
      responses:
        "200":
          description: Rejected quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/contracts:
    get:
      tags: [contracts]
      summary: List contracts
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ContractState"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Contract page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          description: Contract feature is temporarily disabled; existing data is retained.
    post:
      tags: [contracts]
      summary: Create a contract from a sent or accepted quote
      description: |
        Freezes the quote snapshot into the contract document and syncs the
        project amount/contract projection. At most one active contract exists
        per project.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContractRequest"
      responses:
        "201":
          description: Rendered contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "410":
          description: Contract feature is temporarily disabled; existing data is retained.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/contracts/{contractID}:
    get:
      tags: [contracts]
      summary: Get a contract
      parameters:
        - $ref: "#/components/parameters/ContractID"
      responses:
        "200":
          description: Contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "410":
          description: Contract feature is temporarily disabled; existing data is retained.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/contracts/{contractID}/send:
    post:
      tags: [contracts]
      summary: Create the e-sign task and send the contract
      parameters:
        - $ref: "#/components/parameters/ContractID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
      responses:
        "200":
          description: Contract with sign_url and sign_task_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "410":
          description: Contract feature is temporarily disabled; existing data is retained.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Version conflict, illegal state, or `send_in_progress`. The latter
            means another send reserved the contract and is waiting on the
            e-sign provider; retrying within a few minutes would create a
            duplicate task, so retry after the reservation expires.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "502":
          description: The e-sign provider rejected the signing task

  /api/v1/contracts/{contractID}/void:
    post:
      tags: [contracts]
      summary: Void an unsigned contract
      description: Signed contracts cannot be voided through this endpoint.
      parameters:
        - $ref: "#/components/parameters/ContractID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidContractRequest"
      responses:
        "200":
          description: Voided contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "410":
          description: Contract feature is temporarily disabled; existing data is retained.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /webhooks/esign/{provider}:
    post:
      tags: [esign]
      summary: E-sign provider callback
      description: |
        Unauthenticated by JWT; the provider adapter verifies the HMAC signature
        and timestamp. Each task id is routed through `esign_tasks` to its owner
        (contract or change order). Duplicate event ids return `duplicate`,
        unknown tasks return `ignored`, and transient failures return 5xx so the
        provider retries. State changes are idempotent and guarded by the
        subject row.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            example: sandbox
        - name: X-PWF-Signature
          in: header
          required: true
          description: "Sandbox scheme: t=<unix>,v1=<hex HMAC-SHA256 of '<t>.<body>'>"
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ESignCallbackRequest"
      responses:
        "200":
          description: Event outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ESignCallbackResult"
        "400":
          description: Malformed callback payload
        "401":
          description: Missing, stale or invalid signature
        "404":
          description: Unknown provider

  /api/v1/payments/orders:
    post:
      tags: [payments]
      summary: Create (or reuse) a payment order
      description: |
        Amounts are derived server-side from the sent quote's project projection:
        `deposit` does not require contract signing, `balance` requires the deposit
        to be paid, and `full` is only allowed when
        the project has no deposit. Repeating the request while a live order
        exists returns it with 200 instead of creating a second one. A concurrent
        request while the first is still being created returns 409
        `order_in_progress`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "200":
          description: Existing pending order reused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: project_cancelled, deposit_unpaid, already_paid, order_not_pending or order_in_progress
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "502":
          description: The payment provider rejected the order
    get:
      tags: [payments]
      summary: List payment orders
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [creating, pending, paid, closed]
        - name: kind
          in: query
          schema:
            type: string
            enum: [deposit, balance, full]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Orders newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/payments/orders/{orderID}:
    get:
      tags: [payments]
      summary: Get one payment order
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/payments/orders/{orderID}/close:
    post:
      tags: [payments]
      summary: Close a pending order
      description: |
        The order is closed at the payment channel first, then locally, so the
        pay link cannot outlive the local state. Closing an already-closed order
        is idempotent. If the channel already captured the payment, the order is
        reconciled as paid and 409 `order_already_paid` is returned instead of
        closing it.
      parameters:
        - $ref: "#/components/parameters/OrderID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Closed order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: order_not_pending, order_already_paid or reconcile_mismatch
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: The payment provider could not close the order

  /api/v1/payments/orders/{orderID}/reconcile:
    post:
      tags: [payments]
      summary: Reconcile an order with the payment channel
      description: |
        Queries the channel's authoritative state and aligns the local order:
        a captured payment is credited exactly once (synthetic event id
        `reconcile:<out_trade_no>`), a channel-closed order is closed locally.
        This is the recovery path when a callback was lost. A state or amount
        mismatch returns 409 `reconcile_mismatch` and changes nothing.
      parameters:
        - $ref: "#/components/parameters/OrderID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Reconciled order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: reconcile_mismatch or order_not_pending
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: The payment provider could not be queried

  /api/v1/payments:
    get:
      tags: [payments]
      summary: List collected payments
      description: Payments are created only by verified provider callbacks; there is one row per order.
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Payments newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/payments/{paymentID}:
    get:
      tags: [payments]
      summary: Get one payment
      parameters:
        - $ref: "#/components/parameters/PaymentID"
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/payments/{paymentID}/refunds:
    post:
      tags: [payments]
      summary: Request a refund
      description: |
        Omit `amount_cents` to refund everything still refundable. Pending and
        succeeded refunds count against the payment, so repeated requests cannot
        over-refund. Providers may settle asynchronously; the final state arrives
        through a refund callback.
      parameters:
        - $ref: "#/components/parameters/PaymentID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
      responses:
        "201":
          description: Refund accepted (status pending or succeeded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: refund_exceeds_remaining
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "502":
          description: The provider rejected the refund; the attempt is recorded as failed
    get:
      tags: [payments]
      summary: List refunds for a payment
      parameters:
        - $ref: "#/components/parameters/PaymentID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Refunds newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/refunds:
    get:
      tags: [payments]
      summary: List refunds across payments
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Refunds newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /webhooks/payment/{provider}:
    post:
      tags: [payments]
      summary: Payment provider callback
      description: |
        Unauthenticated by JWT; the provider adapter verifies the HMAC signature,
        timestamp and merchant id. Duplicate event ids return `duplicate`, events
        for unknown orders return `ignored`, and authentic events whose amount or
        currency do not match the order are recorded and rejected with 422
        (code `amount_mismatch` / `currency_mismatch`) and never credited.
        A payment for an order that is no longer pending returns 200
        `ignored` with reason `late_payment`: the callback is stored with
        outcome `flagged`, audited and emitted as `payment.late_payment` for
        refund or manual resolution, never credited silently.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            example: sandbox
        - name: X-PWF-Signature
          in: header
          required: true
          description: "Sandbox scheme: t=<unix>,v1=<hex HMAC-SHA256 of '<t>.<body>'>"
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCallbackRequest"
      responses:
        "200":
          description: Event outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCallbackResult"
        "400":
          description: Malformed callback payload
        "401":
          description: Missing, stale or invalid signature
        "404":
          description: Unknown provider
        "422":
          description: Authentic event rejected (amount_mismatch, currency_mismatch)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/invoices:
    post:
      tags: [invoices]
      summary: Request an invoice for a settled payment
      description: |
        The amount always equals the payment amount (one active invoice per
        payment in v1). Approval, issue and void are finance controls reserved
        for the owner; uploads go straight to object storage through a
        presigned URL and are hash-verified on issue.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
      responses:
        "201":
          description: Invoice in requested state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: payment_not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: active_invoice
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      tags: [invoices]
      summary: List invoices
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: payment_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/InvoiceStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Invoices newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/invoices/{invoiceID}:
    get:
      tags: [invoices]
      summary: Get one invoice with its red flushes
      parameters:
        - $ref: "#/components/parameters/InvoiceID"
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/invoices/{invoiceID}/approve:
    post:
      tags: [invoices]
      summary: Approve a requested invoice (owner only)
      parameters:
        - $ref: "#/components/parameters/InvoiceID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedReasonRequest"
      responses:
        "200":
          description: Approved invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: illegal_state or version_conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/invoices/{invoiceID}/reject:
    post:
      tags: [invoices]
      summary: Reject a requested invoice (owner only)
      parameters:
        - $ref: "#/components/parameters/InvoiceID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedReasonRequest"
      responses:
        "200":
          description: Rejected invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: illegal_state or version_conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/invoices/{invoiceID}/file-url:
    post:
      tags: [invoices]
      summary: Get a presigned PUT URL for the invoice PDF
      description: |
        Returns `tenants/{tenant}/invoices/{invoice}/v{n}.pdf` (or a red-flush
        key when `red_flush_id` is set). The issue call re-stats the object and
        streams it through SHA-256, so the recorded hash cannot be forged.
      parameters:
        - $ref: "#/components/parameters/InvoiceID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                red_flush_id:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        "200":
          description: Upload target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceFileUpload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: illegal_state
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/invoices/{invoiceID}/issue:
    post:
      tags: [invoices]
      summary: Record the issued invoice number and verified PDF
      parameters:
        - $ref: "#/components/parameters/InvoiceID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueInvoiceRequest"
      responses:
        "200":
          description: Issued invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: illegal_state, version_conflict or invoice_no_conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: validation_failed (file missing, size or hash mismatch)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: invoice_provider_error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/invoices/{invoiceID}/send:
    post:
      tags: [invoices]
      summary: Mark an issued invoice as sent to the customer
      parameters:
        - $ref: "#/components/parameters/InvoiceID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedReasonRequest"
      responses:
        "200":
          description: Sent invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: illegal_state or version_conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/invoices/{invoiceID}/void:
    post:
      tags: [invoices]
      summary: Void a requested or approved invoice (owner only)
      description: Issued and sent invoices are corrected through red flushes.
      parameters:
        - $ref: "#/components/parameters/InvoiceID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedReasonRequest"
      responses:
        "200":
          description: Voided invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: illegal_state or version_conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/invoices/{invoiceID}/red-flushes:
    get:
      tags: [invoices]
      summary: List red-flush entries queued by refunds
      parameters:
        - $ref: "#/components/parameters/InvoiceID"
      responses:
        "200":
          description: Red flushes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/InvoiceRedFlush"
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/invoices/{invoiceID}/red-flushes/{redFlushID}/issue:
    post:
      tags: [invoices]
      summary: Record the issued red-flush number and verified PDF
      parameters:
        - $ref: "#/components/parameters/InvoiceID"
        - $ref: "#/components/parameters/RedFlushID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueRedFlushRequest"
      responses:
        "200":
          description: Issued red flush
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceRedFlush"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: invoice_not_found or red_flush_not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: illegal_state
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/change-orders:
    post:
      tags: [change-orders]
      summary: Create a change order for a signed project
      description: |
        A change order is an amendment to the signed contract: it must be signed
        through the e-sign provider, then collected through its own supplement
        payment order. Only one change order per project may be active
        (draft, awaiting signature, signed or awaiting payment) at a time. The
        header amount is always the sum of the line items.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChangeOrderRequest"
      responses:
        "201":
          description: Draft change order with its items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: project_not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: active_change_order or illegal_state (contract not signed)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      tags: [change-orders]
      summary: List change orders
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ChangeOrderStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Change orders newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeOrderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/change-orders/{changeOrderID}:
    get:
      tags: [change-orders]
      summary: Get one change order with its items
      parameters:
        - $ref: "#/components/parameters/ChangeOrderID"
      responses:
        "200":
          description: Change order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/change-orders/{changeOrderID}/send:
    post:
      tags: [change-orders]
      summary: Send the change order to the e-sign provider
      parameters:
        - $ref: "#/components/parameters/ChangeOrderID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpectedVersionRequest"
      responses:
        "200":
          description: Change order awaiting signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: illegal_state or version_conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "502":
          description: payment_provider_error (the e-sign channel failed)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/change-orders/{changeOrderID}/payment-order:
    post:
      tags: [change-orders]
      summary: Open (or retry) the supplement payment order
      description: |
        A signed callback opens the supplement order automatically. When that
        call fails (for example a transient provider outage) the amendment stays
        signed and this endpoint retries. It is idempotent: an existing live
        order is returned unchanged.
      parameters:
        - $ref: "#/components/parameters/ChangeOrderID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Change order linked to its supplement order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: illegal_state or order_in_progress
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: payment_provider_error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/change-orders/{changeOrderID}/cancel:
    post:
      tags: [change-orders]
      summary: Cancel a change order before it is paid
      description: |
        A live supplement order is closed at the payment channel first; if the
        channel already captured the payment the amendment is paid and 409
        `change_order_paid` is returned. Applied and reversed amendments are
        financial history and cannot be cancelled.
      parameters:
        - $ref: "#/components/parameters/ChangeOrderID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelChangeOrderRequest"
      responses:
        "200":
          description: Cancelled change order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: change_order_paid, order_in_progress, illegal_state or version_conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "502":
          description: payment_provider_error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/resources:
    post:
      tags: [schedule]
      summary: Create a bookable resource
      description: |
        Resources are photographers, studios, makeup artists, assistants or
        physical equipment. Each resource has capacity one. Buffers widen the
        occupancy range written to resource_blocks but never the availability
        window. Owner and staff only.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceRequest"
      responses:
        "201":
          description: Created resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: resource_conflict (tenant, kind and name are unique)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      tags: [schedule]
      summary: List resources
      parameters:
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/ResourceKind"
        - name: active
          in: query
          schema:
            type: boolean
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Resources ordered by kind and name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/resources/{resourceID}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      tags: [schedule]
      summary: Get a resource with its availability rules
      responses:
        "200":
          description: Resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [schedule]
      summary: Update resource fields
      description: Partial update guarded by expected_version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResourceRequest"
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: version_conflict or resource_conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/resources/{resourceID}/availability:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    put:
      tags: [schedule]
      summary: Replace the weekly availability rules
      description: |
        Rules are ISO weekdays (1 = Monday) with local wall-clock minutes in
        the tenant's schedule timezone. An empty list means 24/7 availability.
        Rules are replaced atomically and bump the resource version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAvailabilityRequest"
      responses:
        "200":
          description: New rule set and version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceAvailabilityRules"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: version_conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      tags: [schedule]
      summary: Read the weekly availability rules
      responses:
        "200":
          description: Current rules and version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceAvailabilityRules"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/resources/{resourceID}/blocks:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      tags: [schedule]
      summary: Create a manual block or closure
      description: |
        Manual blocks and closures share the same exclusion constraint as
        bookings, so an overlap with an existing hold or booking returns
        409 slot_taken. Holds and booking blocks cannot be created here.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceBlockRequest"
      responses:
        "201":
          description: Created block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceBlock"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: slot_taken
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      tags: [schedule]
      summary: List blocks overlapping a window
      description: Defaults to the next 30 days; holds and booking blocks are included.
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Blocks ordered by start
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceBlockList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/resources/{resourceID}/blocks/{blockID}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
      - $ref: "#/components/parameters/BlockID"
    delete:
      tags: [schedule]
      summary: Delete a manual block or closure
      responses:
        "204":
          description: Block deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: block_not_found (holds and booking blocks are not deletable here)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/schedule/availability:
    get:
      tags: [schedule]
      summary: List busy intervals per resource
      description: |
        Busy intervals come from resource_blocks (holds, bookings, manual
        blocks and closures) including each resource's buffers. The window is
        capped at 31 days. The exclusion constraint remains the arbiter when a
        hold is created; this endpoint is the read-side view.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/ResourceKind"
      responses:
        "200":
          description: Busy intervals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleAvailability"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/bookings:
    post:
      tags: [schedule]
      summary: Hold resources for a project
      description: |
        Creates a held booking with a TTL and one hold block per resource.
        The project must exist and not be cancelled or archived; signing and
        payment are checked at confirmation. A project has at most one active
        booking. Overlapping occupancy returns 409 slot_taken.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Held booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: project_not_found or resource_not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: active_booking, slot_taken or illegal_state
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: validation_failed or outside_availability
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      tags: [schedule]
      summary: List bookings
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BookingStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Bookings newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/bookings/{bookingID}:
    parameters:
      - $ref: "#/components/parameters/BookingID"
    get:
      tags: [schedule]
      summary: Get a booking with its resources
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/bookings/{bookingID}/confirm:
    parameters:
      - $ref: "#/components/parameters/BookingID"
    post:
      tags: [schedule]
      summary: Confirm a held booking
      description: |
        Requires a paid deposit or full payment; contract signing is optional. The
        payment settlement hook uses the same path automatically when a
        deposit or full order is captured. Confirming an already-confirmed
        booking is a successful no-op. A lapsed hold returns 409 hold_expired.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpectedVersionRequest"
      responses:
        "200":
          description: Confirmed booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: deposit_required, hold_expired, illegal_state or version_conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/bookings/{bookingID}/reschedule:
    parameters:
      - $ref: "#/components/parameters/BookingID"
    post:
      tags: [schedule]
      summary: Move a held or confirmed booking
      description: |
        Replaces the occupancy in one transaction under the same exclusion
        constraint. Confirmed bookings also update the project shoot times.
        Omitting resource_ids keeps the current resources.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleBookingRequest"
      responses:
        "200":
          description: Rescheduled booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: slot_taken, hold_expired, illegal_state or version_conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: validation_failed or outside_availability
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/bookings/{bookingID}/cancel:
    parameters:
      - $ref: "#/components/parameters/BookingID"
    post:
      tags: [schedule]
      summary: Cancel a held or confirmed booking
      description: |
        Releases every block and moves the associated project to `cancelled`.
        A confirmed booking also clears the project shoot times when they still
        match the booking. Customer quote acceptance is blocked after cancellation.
        Cancellation never refunds money; refunds go through the payments API.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelBookingRequest"
      responses:
        "200":
          description: Cancelled booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: illegal_state or version_conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/bookings/{bookingID}/shot-list:
    parameters:
      - $ref: "#/components/parameters/BookingID"
    get:
      tags: [shoot-prep]
      summary: Get the booking shot list
      description: |
        A booking has at most one shot list. Prep reads stay available after
        the booking is cancelled or expires; writes then return 409
        illegal_state and the history stays readable.
      responses:
        "200":
          description: Shot list with items in sort order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShotList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: booking_not_found or shot_list_not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags: [shoot-prep]
      summary: Create the booking shot list
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShotListRequest"
      responses:
        "201":
          description: Created shot list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShotList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: shot_list_exists or illegal_state
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/shot-lists/{shotListID}:
    parameters:
      - $ref: "#/components/parameters/ShotListID"
    patch:
      tags: [shoot-prep]
      summary: Update the shot list title or note
      description: Requires the current version; a stale version returns 409 version_conflict.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShotListUpdateRequest"
      responses:
        "200":
          description: Updated shot list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShotList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: booking_not_found or shot_list_not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: illegal_state or version_conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/shot-lists/{shotListID}/items:
    parameters:
      - $ref: "#/components/parameters/ShotListID"
    post:
      tags: [shoot-prep]
      summary: Append a shot item
      description: |
        The item is appended with the next sort order. reference_url must be an
        http(s) URL; priority defaults to normal.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShotItemRequest"
      responses:
        "201":
          description: Created shot item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShotItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: booking_not_found or shot_list_not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: illegal_state or version_conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/shot-items/{shotItemID}:
    parameters:
      - $ref: "#/components/parameters/ShotItemID"
    patch:
      tags: [shoot-prep]
      summary: Update a shot item
      description: |
        Partial update driven by expected_version. Toggling done writes done_at
        server-side; clearing done clears it.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShotItemUpdateRequest"
      responses:
        "200":
          description: Updated shot item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShotItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: booking_not_found or shot_item_not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: illegal_state or version_conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [shoot-prep]
      summary: Delete a shot item
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ExpectedVersionQuery"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: booking_not_found or shot_item_not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: illegal_state or version_conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/bookings/{bookingID}/gear:
    parameters:
      - $ref: "#/components/parameters/BookingID"
    get:
      tags: [shoot-prep]
      summary: List the booking gear list
      responses:
        "200":
          description: Gear newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GearList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [shoot-prep]
      summary: Add a gear line
      description: |
        resource_id may reference an equipment resource in the same tenant; the
        name then defaults to the resource name. quantity is 1..100 (default 1)
        and names are unique per booking.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GearRequest"
      responses:
        "201":
          description: Created gear line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GearItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: gear_conflict or illegal_state
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/gear/{gearID}:
    parameters:
      - $ref: "#/components/parameters/GearID"
    patch:
      tags: [shoot-prep]
      summary: Update a gear line
      description: |
        Partial update driven by expected_version. Ticking checked writes
        checked_at server-side; clearing checked clears it.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GearUpdateRequest"
      responses:
        "200":
          description: Updated gear line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GearItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: booking_not_found or gear_not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: gear_conflict, illegal_state or version_conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [shoot-prep]
      summary: Delete a gear line
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ExpectedVersionQuery"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: booking_not_found or gear_not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: illegal_state or version_conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/bookings/{bookingID}/authorizations:
    parameters:
      - $ref: "#/components/parameters/BookingID"
    get:
      tags: [shoot-prep]
      summary: List the booking authorizations
      description: |
        Authorization ledger for the shoot. The kind/subject pair is unique per
        booking. signed_at is server time; the status is the evidence.
      responses:
        "200":
          description: Authorizations ordered by kind and subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [shoot-prep]
      summary: Add an authorization
      description: |
        status defaults to pending. Creating a signed row stamps signed_at with
        server time; waived requires a note. Changes re-plan the
        auth_incomplete reminder in the same transaction.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationRequest"
      responses:
        "201":
          description: Created authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingAuthorization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: authorization_conflict or illegal_state
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/authorizations/{authorizationID}:
    parameters:
      - $ref: "#/components/parameters/AuthorizationID"
    patch:
      tags: [shoot-prep]
      summary: Correct an authorization status or note
      description: |
        signed stamps signed_at with server time; waived requires a note. A
        stale expected_version returns 409 version_conflict.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationUpdateRequest"
      responses:
        "200":
          description: Updated authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingAuthorization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: booking_not_found or authorization_not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: illegal_state or version_conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [shoot-prep]
      summary: Delete a pending authorization
      description: |
        Only pending rows may be deleted. signed and waived rows are evidence
        and return 409 illegal_state.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ExpectedVersionQuery"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: booking_not_found or authorization_not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: illegal_state or version_conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/bookings/{bookingID}/call-sheets:
    parameters:
      - $ref: "#/components/parameters/BookingID"
    post:
      tags: [shoot-prep]
      summary: Freeze a call sheet version
      description: |
        Only confirmed bookings may freeze. Each freeze stores the canonical
        JSON snapshot byte-for-byte with its SHA-256 as a new version. Reschedule
        does not rewrite old versions; freeze again for a fresh notice.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Frozen call sheet with its snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallSheet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: illegal_state (booking not confirmed)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      tags: [shoot-prep]
      summary: List call sheet versions
      description: Summaries newest version first; snapshots are omitted.
      responses:
        "200":
          description: Call sheet versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallSheetList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/call-sheets/{callSheetID}:
    parameters:
      - $ref: "#/components/parameters/CallSheetID"
    get:
      tags: [shoot-prep]
      summary: Get a frozen call sheet
      description: |
        Returns the stored snapshot and the SHA-256 recomputed from the exact
        stored bytes. A mismatch returns 500 instead of serving unverified data.
        The snapshot contains internal client contact data; retoucher access is
        not granted.
      responses:
        "200":
          description: Call sheet with snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallSheet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/call-sheets/{callSheetID}/html:
    parameters:
      - $ref: "#/components/parameters/CallSheetID"
    get:
      tags: [shoot-prep]
      summary: Render a frozen call sheet as printable HTML
      description: |
        Server-side rendering from the frozen snapshot only; there is no JS and
        no external resource. html/template escapes every value and reference
        URLs are http(s) only. The response sets Cache-Control no-store,
        X-Content-Type-Options nosniff and a restrictive CSP.
      responses:
        "200":
          description: Printable call sheet page
          content:
            text/html:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/notifications:
    get:
      tags: [notifications]
      summary: List reminders
      description: |
        Tenant-wide notification feed. unread is a tenant-wide count of
        notifications without read_at, independent of the current filter.
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/NotificationType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/NotificationStatus"
        - name: booking_id
          in: query
          schema:
            type: string
            format: uuid
        - name: unread
          in: query
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Reminders newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/notifications/{notificationID}:
    parameters:
      - $ref: "#/components/parameters/NotificationID"
    get:
      tags: [notifications]
      summary: Get a reminder with its deliveries
      responses:
        "200":
          description: Reminder with delivery rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: notification_not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/notifications/stream:
    get:
      tags: [notifications]
      summary: Subscribe to tenant notifications
      description: Authenticated Server-Sent Events stream. Supports Last-Event-ID for reconnects; event name is notification.
      responses:
        "200":
          description: Notification event stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/notifications/{notificationID}/read:
    parameters:
      - $ref: "#/components/parameters/NotificationID"
    post:
      tags: [notifications]
      summary: Mark a reminder read
      description: |
        Idempotent: read_at keeps its first value. Reading is shared across the
        tenant; there is no per-recipient inbox state in M3.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Reminder with read_at set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: notification_not_found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/payment-alerts:
    get:
      tags: [payment-alerts]
      summary: List payment security alerts
      description: |
        Alerts are deduplicated open findings (repeat events fold into
        `occurrences`). Webhook delivery is tracked in `notify_status`.
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PaymentAlertStatus"
        - name: severity
          in: query
          schema:
            $ref: "#/components/schemas/PaymentAlertSeverity"
        - name: code
          in: query
          schema:
            type: string
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Alerts newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentAlertList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/payment-alerts/{alertID}:
    get:
      tags: [payment-alerts]
      summary: Get one payment alert
      parameters:
        - $ref: "#/components/parameters/AlertID"
      responses:
        "200":
          description: Alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentAlert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/payment-alerts/{alertID}/acknowledge:
    post:
      tags: [payment-alerts]
      summary: Acknowledge an open alert
      parameters:
        - $ref: "#/components/parameters/AlertID"
      responses:
        "200":
          description: Acknowledged alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentAlert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: alert_not_open
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/payment-alerts/{alertID}/resolve:
    post:
      tags: [payment-alerts]
      summary: Resolve an open or acknowledged alert
      parameters:
        - $ref: "#/components/parameters/AlertID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Resolved alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentAlert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: alert_not_open
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /agent/v1/ingest-batches:
    post:
      tags: [ingest]
      summary: Open an ingest batch for one card copy session
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBatchRequest"
      responses:
        "201":
          description: Batch opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /agent/v1/ingest-batches/{batchID}/assets/batch:
    post:
      tags: [ingest]
      summary: Register up to 500 files with metadata hashes
      parameters:
        - $ref: "#/components/parameters/BatchID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterFilesRequest"
      responses:
        "200":
          description: Registration summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /agent/v1/ingest-batches/{batchID}/finalize:
    post:
      tags: [ingest]
      summary: Seal the batch and enqueue asynchronous verification (idempotent)
      description: |
        Finalize is synchronous only for sealing: the batch moves to completed
        and an `ingest.verify` job is queued. Repeating the call returns the
        same job. Objects are promoted to `verified` only after the worker
        confirms both size and SHA-256; failures land in `missing`/`corrupt`.
      parameters:
        - $ref: "#/components/parameters/BatchID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Verification job accepted
          headers:
            Location:
              schema:
                type: string
              description: Job resource, /agent/v1/jobs/{jobID}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /agent/v1/ingest-batches/{batchID}:
    get:
      tags: [ingest]
      summary: Reconcile a batch after a restart
      description: |
        Returns the batch, asset counts and verify job. The agent uses this
        instead of trusting local upload state after a crash. Counts use exact
        status matching; assets that advanced past verification (M5 stages) are
        only reflected in `total`.
      parameters:
        - $ref: "#/components/parameters/BatchID"
      responses:
        "200":
          description: Batch status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /agent/v1/jobs:
    get:
      tags: [ingest]
      summary: List jobs visible to the caller's tenant
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, succeeded, failed]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Job page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /agent/v1/jobs/{jobID}:
    get:
      tags: [ingest]
      summary: Poll a job
      parameters:
        - name: jobID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /agent/v1/uploads/presign:
    post:
      tags: [ingest]
      summary: Get a single PUT URL or a multipart plan
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignRequest"
      responses:
        "200":
          description: Upload plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPlan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /agent/v1/uploads/{assetID}/complete:
    post:
      tags: [ingest]
      summary: Finalize an upload and mark the asset uploaded
      parameters:
        - $ref: "#/components/parameters/AssetID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUploadRequest"
      responses:
        "200":
          description: Asset after upload verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /agent/v1/devices:
    post:
      tags: [ingest]
      summary: Register or update this agent installation (idempotent)
      description: |
        Upserts by `fingerprint` within the tenant. The first registration
        returns 201, a repeat returns 200 with the same device id. A device
        disabled by an operator is never reactivated by re-registration: the
        call returns 403 device_disabled and its stored key is left untouched.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistrationRequest"
      responses:
        "200":
          description: Existing device updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "201":
          description: Device registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /agent/v1/heartbeats:
    post:
      tags: [ingest]
      summary: Report liveness and read the server contract
      description: |
        Updates `last_seen_at` and returns server time, the minimum supported
        agent version and feature flags. An unknown device returns 404
        device_not_found; a disabled device returns 403 device_disabled.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatRequest"
      responses:
        "200":
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  # ------------------------------------------------------------ M5 galleries

  /api/v1/galleries:
    get:
      tags: [gallery]
      summary: List selection galleries (owner, staff, assistant)
      description: |
        Newest round first. `asset_count` counts gallery membership regardless
        of decision. Statuses: draft, published, expired, revoked.
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, published, expired, revoked]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Gallery summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/GallerySummary"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      tags: [gallery]
      summary: Create a draft gallery
      description: |
        `round_no` is the next round in the project, so a new gallery is always
        a fresh immutable selection round. `watermark_text` is snapshotted at
        creation; empty falls back to the tenant name when previews are drawn.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalleryCreateRequest"
      responses:
        "201":
          description: Draft gallery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gallery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/galleries/{galleryID}:
    get:
      tags: [gallery]
      summary: Gallery detail with counts, tokens and decisions
      parameters:
        - $ref: "#/components/parameters/GalleryID"
      responses:
        "200":
          description: Gallery detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [gallery]
      summary: Update title, deadline, limit, download flag or watermark
      description: |
        Requires `expected_version`; a stale value returns 409 version_conflict.
        Published galleries accept deadline extensions (and audit them) but the
        watermark cannot change after publishing — create the next round.
        Passing `null` clears `expires_at` or `selection_limit`.
      parameters:
        - $ref: "#/components/parameters/GalleryID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalleryUpdateRequest"
      responses:
        "200":
          description: Updated gallery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gallery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/galleries/{galleryID}/assets:
    get:
      tags: [gallery]
      summary: List gallery assets with decisions and preview readiness
      description: |
        Owner/staff/assistant. `filter` accepts all, none/undecided, selected or
        rejected; `q` matches the filename. `thumb_url` is a short-lived signed
        URL and is empty while the thumb is still missing.
      parameters:
        - $ref: "#/components/parameters/GalleryID"
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, none, undecided, selected, rejected]
            default: all
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Gallery assets and the derivative summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryAssets"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      tags: [gallery]
      summary: Attach project assets to a draft gallery
      description: |
        Draft only. Assets must belong to the gallery's project and be verified
        or derivative_ready; duplicates are skipped, so retries are safe.
      parameters:
        - $ref: "#/components/parameters/GalleryID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalleryAttachRequest"
      responses:
        "200":
          description: Attach result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryAssetChange"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/galleries/{galleryID}/assets/{assetID}:
    delete:
      tags: [gallery]
      summary: Remove an asset from a draft gallery
      description: Draft only; the customer's decision for that asset is removed too.
      parameters:
        - $ref: "#/components/parameters/GalleryID"
        - $ref: "#/components/parameters/AssetID"
      responses:
        "200":
          description: Gallery after removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gallery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/galleries/{galleryID}/candidates:
    get:
      tags: [gallery]
      summary: Project assets for the gallery picker
      description: |
        Lists verified/derivative_ready assets of the gallery's project with an
        `in_gallery` flag so the UI can render add buttons idempotently.
      parameters:
        - $ref: "#/components/parameters/GalleryID"
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Candidate page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidatePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/galleries/{galleryID}/publish:
    post:
      tags: [gallery]
      summary: Publish the gallery (writes the immutable manifest)
      description: |
        Every asset must have complete thumb+display derivatives rendered with
        the gallery watermark. Missing previews return 409
        `derivatives_incomplete` with the missing count and sample asset ids,
        and derive jobs are queued. Retrying after the worker finishes is safe;
        publishing an already published gallery is idempotent and does not bump
        `manifest_version`.
      parameters:
        - $ref: "#/components/parameters/GalleryID"
      responses:
        "200":
          description: Published gallery (manifest_key / manifest_version set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gallery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: derivatives_incomplete or invalid_state
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/galleries/{galleryID}/tokens:
    post:
      tags: [gallery]
      summary: Issue a share token (plaintext returned once)
      description: |
        Published galleries only. The database stores the SHA-256 of the token,
        so this response is the only copy. `gallery_url` embeds the token in the
        URL fragment (`/#/a/<token>`), which never reaches server access logs
        or Referer headers.
      parameters:
        - $ref: "#/components/parameters/GalleryID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalleryTokenCreateRequest"
      responses:
        "201":
          description: Token metadata plus the one-time plaintext
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryTokenIssued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/galleries/{galleryID}/tokens/{tokenID}:
    delete:
      tags: [gallery]
      summary: Revoke a share token
      description: Sessions derived from the token stop working immediately.
      parameters:
        - $ref: "#/components/parameters/GalleryID"
        - $ref: "#/components/parameters/GalleryTokenID"
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/galleries/{galleryID}/revoke:
    post:
      tags: [gallery]
      summary: Revoke the whole gallery
      description: |
        published -> revoked. Every share token is revoked in the same
        transaction; the customer app answers 410 on the next request. The
        operation is idempotent for an already revoked gallery.
      parameters:
        - $ref: "#/components/parameters/GalleryID"
      responses:
        "200":
          description: Revoked gallery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gallery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/galleries/{galleryID}/reopen:
    post:
      tags: [gallery]
      summary: Reopen selection after a submission
      description: |
        Clears `submitted_at` so the customer can revise decisions before the
        deadline. Published galleries only; an expired gallery must first get a
        new `expires_at` via PATCH.
      parameters:
        - $ref: "#/components/parameters/GalleryID"
      responses:
        "200":
          description: Reopened gallery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gallery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/projects/{projectID}/derivatives:derive:
    post:
      tags: [gallery]
      summary: Queue thumb/display rendering for a project
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeriveRequest"
      responses:
        "200":
          description: Derive summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeriveResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /agent/v1/derivatives:presign:
    post:
      tags: [ingest]
      summary: Presign a PUT for an agent-rendered gallery preview
      description: |
        `kind` is `gallery`. The object key is derived from the preview's
        SHA-256, so the same JPEG always lands on the same key and retries are
        idempotent. Single PUT only, at most 16 MiB.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivativePresignRequest"
      responses:
        "200":
          description: Upload slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivativePresign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /agent/v1/derivatives/{assetID}:complete:
    post:
      tags: [ingest]
      summary: Register an uploaded gallery preview
      description: |
        The server stats the object and re-hashes the stream before recording
        `asset_derivatives(kind=gallery)`, marking the asset derivative_ready
        and queueing thumb/display rendering. Repeating the call is idempotent.
      parameters:
        - $ref: "#/components/parameters/AssetID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DerivativeCompleteRequest"
      responses:
        "200":
          description: Registered derivative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Derivative"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  # --------------------------------------------------------- proof (staff)

  /api/v1/proof-rounds:
    get:
      tags: [proof]
      summary: List proof rounds (owner, staff, assistant, retoucher)
      description: |
        Newest round first. `status` accepts one of `open`, `in_review`,
        `changes_requested`, `retouching`, `resubmitted`, `approved`.
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: gallery_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_review, changes_requested, retouching, resubmitted, approved]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Proof round summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProofRoundSummary"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      tags: [proof]
      summary: Create a proof round from the submitted selection
      description: |
        Snapshots the gallery's selected assets (or the `asset_ids` subset),
        requires thumb/display previews for every item, and returns the only
        copy of the first proof link. `due_at` must be in the future (at most
        180 days).

        Proof rounds are not gated by contract round counts. A round may cycle
        through customer changes and retouch delivery until it is approved.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProofRoundRequest"
      responses:
        "201":
          description: Round, first link and item count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedProofRound"
        "402":
          description: Extra selected images must be fully paid before starting retouching.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: derivatives_incomplete
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/proof-rounds/{roundID}:
    get:
      tags: [proof]
      summary: Proof round detail with items, tokens and retouch task
      parameters:
        - $ref: "#/components/parameters/ProofRoundID"
      responses:
        "200":
          description: Round detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofRoundDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [proof]
      summary: Extend the review deadline
      description: |
        Requires `expected_version`; only allowed before approval and only to a
        future timestamp. Bumps the round version and writes an audit entry.
      parameters:
        - $ref: "#/components/parameters/ProofRoundID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtendProofRoundRequest"
      responses:
        "200":
          description: Updated round
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofRound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/proof-rounds/{roundID}/tokens:
    post:
      tags: [proof]
      summary: Issue another proof link
      description: |
        The plaintext token is returned exactly once; only its SHA-256 is
        stored. `max_visits` 0 means unlimited; `expires_at` defaults to the
        round deadline plus the configured grace period.
      parameters:
        - $ref: "#/components/parameters/ProofRoundID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueProofTokenRequest"
      responses:
        "201":
          description: Newly issued link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedProofToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/proof-rounds/{roundID}/tokens/{tokenID}:
    delete:
      tags: [proof]
      summary: Revoke a proof link
      description: |
        Revocation takes effect on the next request: live sessions bound to the
        token are rejected with 401 `session_revoked`.
      parameters:
        - $ref: "#/components/parameters/ProofRoundID"
        - $ref: "#/components/parameters/ProofTokenID"
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/proof-rounds/{roundID}/notify:
    post:
      tags: [proof]
      summary: Send a fresh invitation to the customer
      description: |
        Mints a new token (the previous plaintext is unrecoverable) and queues
        `email.send` or the SMS provider. The mail is re-checked just before
        delivery; approved or revoked rounds are skipped. The body text is
        cleared after a successful send.
      parameters:
        - $ref: "#/components/parameters/ProofRoundID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifyProofRequest"
      responses:
        "202":
          description: Queued invitation with a new link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofInvitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: client_email_missing, client_phone_missing, channel_unavailable or invalid_state
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/proof-rounds/{roundID}/comments:
    get:
      tags: [proof]
      summary: List comments and annotations
      parameters:
        - $ref: "#/components/parameters/ProofRoundID"
        - name: asset_id
          in: query
          schema:
            type: string
            format: uuid
        - name: include_resolved
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Comments in creation order
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProofComment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/proof-rounds/{roundID}/comments/{commentID}/resolve:
    post:
      tags: [proof]
      summary: Resolve a customer comment
      description: Staff may resolve any comment; the operation is idempotent.
      parameters:
        - $ref: "#/components/parameters/ProofRoundID"
        - $ref: "#/components/parameters/ProofCommentID"
      responses:
        "200":
          description: Resolved comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofComment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/proof-rounds/{roundID}/retouch:
    post:
      tags: [proof]
      summary: Accept the change request and start retouching
      description: |
        Moves `changes_requested` to `retouching` and creates one active retouch
        task with the round items. With the `folder_watch` provider the source
        export is queued at the same time.
      parameters:
        - $ref: "#/components/parameters/ProofRoundID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "201":
          description: Retouch task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetouchTaskSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/proof-rounds/{roundID}/revisions:
    post:
      tags: [proof]
      summary: Upload a retouched version (manual provider)
      description: |
        Multipart form with `asset_id`, `sha256`, `size`, `width`, `height`,
        `note` and `file` (JPEG/PNG/WebP, max 50 MiB). The server hashes the
        stream; a mismatch returns 422 `checksum_mismatch`. Re-uploading the
        same checksum returns 200 with `duplicate: true` instead of a new
        version. Previews are derived asynchronously.
      parameters:
        - $ref: "#/components/parameters/ProofRoundID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RevisionUpload"
      responses:
        "201":
          description: New revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedRevision"
        "200":
          description: Duplicate checksum; the existing revision is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedRevision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: payload_too_large
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: checksum_mismatch or invalid_revision
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/proof-rounds/{roundID}/resubmit:
    post:
      tags: [proof]
      summary: Hand the retouched round back to the customer
      description: |
        Every item must have a `derivative_ready` revision created after the
        round entered `retouching`; otherwise 409 `revisions_incomplete` lists
        the missing assets. On success the round moves to `resubmitted` and the
        customer receives the follow-up mail.
      parameters:
        - $ref: "#/components/parameters/ProofRoundID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Round moved to resubmitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofRound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  # --------------------------------------------------------- integration

  /api/v1/integrations:
    get:
      tags: [integration]
      summary: Retouch integration health (owner, staff, assistant, retoucher)
      description: |
        Reports the active provider, the FolderWatch root (when configured),
        job counts by status and the most recent failures.
      responses:
        "200":
          description: Integration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/integrations/folder-watch/sync:
    post:
      tags: [integration]
      summary: Scan the incoming directory once (owner only)
      description: |
        Manual trigger for the FolderWatch importer. Imports are idempotent by
        SHA-256, so repeated scans never create duplicate revisions. Returns
        409 `channel_unavailable` when another provider is active.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Number of revisions imported by this scan
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  # --------------------------------------------------------- customer portal /c/v1

  /c/v1/auth/wechat:
    post:
      tags: [customer]
      summary: Exchange WeChat login and phone authorization codes
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                phone_code: { type: string }
                phone: { type: string, description: Development-only phone input }
                name: { type: string, maxLength: 120 }
                invite_token: { type: string, description: Optional invitation token; when present, login atomically links the customer to that studio }
      responses:
        "200":
          description: Customer access and rotating refresh tokens
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token, customer, role]
                properties:
                  access_token: { type: string }
                  access_expires_at: { type: string, format: date-time }
                  refresh_token: { type: string }
                  refresh_expires_at: { type: string, format: date-time }
                  role: { type: string, enum: [client] }
                  customer: { type: object, additionalProperties: true }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: WeChat credentials or provider unavailable }

  /c/v1/auth/phone/code:
    post:
      tags: [customer]
      summary: Request a customer phone login code
      description: Development mode returns a development_code for local testing. Production returns sms_unavailable until a real SMS provider is configured.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        "200": { description: Code sent or development code returned }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { description: Too many requests }
        "503": { description: SMS provider unavailable }

  /c/v1/auth/phone/login:
    post:
      tags: [customer]
      summary: Register or sign in a customer using a verified phone code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, name]
              properties:
                phone: { type: string }
                code: { type: string, minLength: 6, maxLength: 6 }
                name: { type: string, maxLength: 120 }
      responses:
        "200": { description: Customer session }
        "401": { description: Login code is invalid or expired }
        "409": { description: Phone is linked to conflicting customer records }

  /c/v1/auth/refresh:
    post:
      tags: [customer]
      summary: Rotate a customer refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200": { description: New customer access and refresh tokens }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /c/v1/auth/logout:
    post:
      tags: [customer]
      summary: Revoke a customer refresh token
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "204": { description: Token revoked }

  /c/v1/invites/resolve:
    post:
      tags: [customer]
      summary: Resolve a photographer invitation
      description: The raw invitation token is sent in the body and never placed in an API path or access log.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: Studio name and public active service packages }
        "404": { description: Invitation is invalid, expired, or revoked }

  /c/v1/photographers/resolve:
    post:
      tags: [customer]
      summary: Resolve a public photographer code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 6, maxLength: 24 }
      responses:
        "200": { description: Photographer studio and active booking services }
        "404": { description: Photographer code is unknown }

  /c/v1/invites/slots:
    post:
      tags: [customer]
      summary: List available slots for an invited studio and service
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_id, day]
              properties:
                invite_token: { type: string }
                photographer_code: { type: string }
                service_id: { type: string, format: uuid }
                day: { type: string, format: date }
      responses:
        "200": { description: Available start/end times in the studio schedule timezone }
        "404": { description: Invitation or service unavailable }

  /c/v1/me/studios:
    get:
      tags: [customer]
      summary: List studios linked to the authenticated customer
      responses:
        "200": { description: Customer studio memberships }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /c/v1/me/projects:
    get:
      tags: [customer]
      summary: List customer projects and active quotes
      description: Returns sent/accepted quote details and line items for every linked project.
      responses:
        "200": { description: Projects and current quotes across linked studios, tenant-scoped }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /c/v1/me/projects/{projectID}/payment-orders:
    post:
      tags: [customer]
      summary: Create or reuse a payment order for the customer's project
      parameters:
        - name: projectID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [deposit, balance, full] }
      responses:
        "200": { description: Existing pending order reused }
        "201": { description: Payment order created }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Project is not linked to this customer }
        "409": { $ref: "#/components/responses/Conflict" }

  /c/v1/me/projects/{projectID}/payment-orders/{orderID}/sandbox-complete:
    post:
      tags: [customer]
      summary: Complete a payment in the development sandbox
      description: Available only when the configured provider is sandbox; the server generates and processes the ordinary callback internally.
      parameters:
        - name: projectID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: orderID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Sandbox callback result }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Payment order is not linked to this customer project }
        "409": { $ref: "#/components/responses/Conflict" }

  /c/v1/me/quotes/{quoteID}/accept:
    post:
      tags: [customer]
      summary: Accept a quote belonging to the authenticated customer
      description: The quote must be sent, unexpired, and attached to one of the customer's linked studio projects.
      parameters:
        - $ref: "#/components/parameters/QuoteID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpectedVersionRequest"
      responses:
        "200": { description: Accepted quote }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Quote is not available to this customer }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /c/v1/me/bookings:
    get:
      tags: [customer]
      summary: List bookings linked to the authenticated customer
      responses:
        "200": { description: Bookings across linked studios }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /c/v1/bookings:
    post:
      tags: [customer]
      summary: Create a temporary hold from a photographer code or legacy invitation
      description: Request IDs make retries return the original booking. The database exclusion constraint remains the slot arbiter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_id, request_id, starts_at]
              properties:
                invite_token: { type: string }
                photographer_code: { type: string }
                service_id: { type: string, format: uuid }
                request_id: { type: string, minLength: 16, maxLength: 80 }
                starts_at: { type: string, format: date-time }
                note: { type: string, maxLength: 2000 }
      responses:
        "201": { description: Temporary booking hold and expiry time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: slot_taken }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /c/v1/admin/services:
    get:
      tags: [schedule]
      summary: List photographer booking services
      responses:
        "200": { description: Tenant-owned service packages }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [schedule]
      summary: Create a photographer booking service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_id, name, duration_minutes, price_cents]
              properties:
                resource_id: { type: string, format: uuid }
                name: { type: string, maxLength: 120 }
                description: { type: string, maxLength: 2000 }
                duration_minutes: { type: integer, minimum: 15, maximum: 1440 }
                price_cents: { type: integer, minimum: 0 }
                included_retouch_count: { type: integer, minimum: 0, maximum: 10000 }
                extra_retouch_unit_price_cents: { type: integer, minimum: 0 }
                active: { type: boolean, default: true }
      responses:
        "201": { description: Created service package }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /c/v1/admin/services/{serviceID}:
    patch:
      tags: [schedule]
      summary: Update a photographer booking service
      parameters:
        - name: serviceID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, duration_minutes, price_cents, expected_version]
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: string, maxLength: 2000 }
                duration_minutes: { type: integer, minimum: 15, maximum: 1440 }
                price_cents: { type: integer, minimum: 0 }
                included_retouch_count: { type: integer, minimum: 0, maximum: 10000 }
                extra_retouch_unit_price_cents: { type: integer, minimum: 0 }
                active: { type: boolean }
                expected_version: { type: integer, minimum: 1 }
      responses:
        "200": { description: Updated service package }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /c/v1/admin/invites:
    post:
      tags: [schedule]
      summary: Create a 60-day customer booking invitation and WeChat mini program code
      description: Returns the one-time raw invite, H5 preview URL, mini program page path, and a base64 PNG when WeChat credentials are configured. QR generation failure does not invalidate the invite.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "201": { description: Invite token shown once with preview URL/path and optional QR code }
        "403": { $ref: "#/components/responses/Forbidden" }

  # --------------------------------------------------------- customer /g/v1

  /g/v1/session:
    post:
      tags: [customer]
      summary: Exchange a share token for a session
      description: |
        Public endpoint: no staff JWT, no Authorization header. The token comes
        from the URL fragment. A successful exchange increments the visit
        counter and returns a 2h bearer session capped at the token expiry.
        Errors: 401 invalid_token, 410 expired/revoked, 429 too_many_visits.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GallerySessionRequest"
      responses:
        "201":
          description: Session and album metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GallerySession"
        "401":
          description: invalid_token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          $ref: "#/components/responses/Gone"

    get:
      tags: [customer]
      summary: Refresh album metadata for the current session
      security:
        - gallerySession: []
      responses:
        "200":
          description: Album metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryAlbum"
        "401":
          description: invalid_session or session_revoked
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          $ref: "#/components/responses/Gone"

  /g/v1/capture-events:
    post:
      tags: [customer]
      summary: Record a supported mini-program screen capture event
      description: Public share-token endpoint used by the WeChat mini-program host. Records screenshot or recording-start events in the audit trail; it cannot prevent every operating-system capture method.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, event]
              properties:
                token: { type: string }
                event: { type: string, enum: [screen_capture, screen_recording_start] }
      responses:
        "202": { description: Capture event recorded }
        "400": { description: Invalid capture event request }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /g/v1/albums/{albumID}/manifest:
    get:
      tags: [customer]
      summary: Page through the published manifest
      description: |
        Keyset pagination by asset position (`limit` max 60). Every item carries
        10-minute presigned thumb/display URLs; the API never proxies bytes.
        Responses are `Cache-Control: no-store` and `Referrer-Policy:
        no-referrer`.
      security:
        - gallerySession: []
      parameters:
        - $ref: "#/components/parameters/AlbumID"
        - name: cursor
          in: query
          description: Opaque cursor from the previous page
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 40
      responses:
        "200":
          description: Manifest page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManifestPage"
        "401":
          description: invalid_session or session_revoked
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"

  /g/v1/selections:
    post:
      tags: [customer]
      summary: Apply a batch of selection decisions
      description: |
        Optimistic concurrency: `expected_version` must equal the album's
        `selection_version`. A mismatch returns 409 `version_conflict` with
        `current_version` so the client can replay once against fresh state.
        Up to `gallery.selection_batch` items (default 200). Selection reads
        and writes require the project balance to be paid. The first submit
        opens a two-hour full-edit window; after it expires the client may only
        append new selections. Requires an `Idempotency-Key` for safe retries.
      security:
        - gallerySession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectionBatchRequest"
      responses:
        "200":
          description: New selection version and counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectionBatchResult"
        "401":
          description: invalid_session or session_revoked
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: version_conflict, selection_limit_exceeded or selection_locked
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /g/v1/albums/{albumID}/submit:
    post:
      tags: [customer]
      summary: Submit the selection to the studio
      description: |
        Stamps `submitted_at`; the first submit sets `selection_edit_until` two
        hours later. Extra selected images above the snapshotted package amount
        create an independent payment order. Refunds for deselections are
        requested after the edit window expires.
      security:
        - gallerySession: []
      parameters:
        - $ref: "#/components/parameters/AlbumID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectionSubmitRequest"
      responses:
        "200":
          description: Album after submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryAlbum"
        "401":
          description: invalid_session or session_revoked
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: version_conflict, selection_limit_exceeded or already_submitted
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /g/v1/proof/session:
    post:
      tags: [proof]
      summary: Exchange a proof link for a proof session
      description: |
        Public endpoint: the token comes from the URL fragment
        (`/#/p/<token>`), never from a query string. A successful exchange
        increments the visit counter and returns a 4h bearer session capped at
        the token expiry. The session is bound to one round and one token.
        Errors: 401 invalid_token, 410 expired/revoked/gallery_revoked,
        429 too_many_visits.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProofSessionRequest"
      responses:
        "201":
          description: Session, expiry and round metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofSessionView"
        "401":
          description: invalid_token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: expired, revoked or gallery_revoked
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    get:
      tags: [proof]
      summary: Refresh the proof round header
      security:
        - proofSession: []
      responses:
        "200":
          description: Current round metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  round:
                    $ref: "#/components/schemas/CustomerProofRound"
        "401":
          description: invalid_session, session_revoked or session_expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          $ref: "#/components/responses/Gone"

  /g/v1/proof/rounds/{roundID}/manifest:
    get:
      tags: [proof]
      summary: Page through the proof manifest
      description: |
        Keyset pagination by asset position (`limit` max 60). Each item carries
        the newest ready revision's presigned thumb/display URLs, falling back
        to the original previews; `revision_no > 0` marks a retouched version.
        The first read moves an `open` round to `in_review`. Responses are
        `Cache-Control: no-store` and `Referrer-Policy: no-referrer`.
      security:
        - proofSession: []
      parameters:
        - $ref: "#/components/parameters/ProofRoundID"
        - name: cursor
          in: query
          description: Opaque cursor from the previous page
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 40
      responses:
        "200":
          description: Manifest page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofManifestPage"
        "401":
          description: invalid_session, session_revoked or session_expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: round_mismatch
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"

  /g/v1/proof/rounds/{roundID}/comments:
    get:
      tags: [proof]
      summary: List the round's comments
      security:
        - proofSession: []
      parameters:
        - $ref: "#/components/parameters/ProofRoundID"
        - name: asset_id
          in: query
          schema:
            type: string
            format: uuid
        - name: include_resolved
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Comments in creation order
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProofComment"
        "401":
          description: invalid_session, session_revoked or session_expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: round_mismatch
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          $ref: "#/components/responses/Gone"
    post:
      tags: [proof]
      summary: Create a comment or annotation
      description: |
        `body` (max 2000 characters) and/or a normalized `annotation` are
        required. `parent_id` must point at a comment on the same asset.
        Supply `Idempotency-Key` to make retries safe; it is stored as
        `client_ref` and the same key returns the original comment.
      security:
        - proofSession: []
      parameters:
        - $ref: "#/components/parameters/ProofRoundID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProofCommentRequest"
      responses:
        "201":
          description: Stored comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofComment"
        "401":
          description: invalid_session, session_revoked or session_expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: round_mismatch
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          description: validation_failed, invalid_annotation, invalid_parent or unknown_asset
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /g/v1/proof/rounds/{roundID}/comments/{commentID}/resolve:
    post:
      tags: [proof]
      summary: Resolve one of the customer's own comments
      description: Staff comments cannot be resolved by the customer (403).
      security:
        - proofSession: []
      parameters:
        - $ref: "#/components/parameters/ProofRoundID"
        - $ref: "#/components/parameters/ProofCommentID"
      responses:
        "200":
          description: Resolved comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofComment"
        "401":
          description: invalid_session, session_revoked or session_expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: comment_forbidden or round_mismatch
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"

  /g/v1/proof/rounds/{roundID}/submit:
    post:
      tags: [proof]
      summary: Approve the round or request changes
      description: |
        Optimistic concurrency on `expected_version`. Repeating the same
        decision at the same version is idempotent (200). After every resubmit
        the customer may approve or request changes again; only approval closes
        the review round.
      security:
        - proofSession: []
      parameters:
        - $ref: "#/components/parameters/ProofRoundID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProofRequest"
      responses:
        "200":
          description: Round after the decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofRound"
        "401":
          description: invalid_session, session_revoked or session_expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: round_mismatch
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: version_conflict or invalid_state
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/deliveries:
    get:
      tags: [delivery]
      summary: List deliveries
      operationId: listDeliveries
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DeliveryStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Deliveries newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeliverySummary"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      tags: [delivery]
      summary: Create the delivery for an approved proof round
      description: |
        Requires an `approved` proof round. A second request for the same round
        returns the existing delivery (200); a new row returns 201. Payment is
        not required until build time.
      operationId: createDelivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeliveryRequest"
      responses:
        "201":
          description: Delivery created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverySummary"
        "200":
          description: Existing delivery for this round
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: round_not_approved
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/deliveries/{deliveryID}:
    get:
      tags: [delivery]
      summary: Delivery detail with packages, tokens and web warnings
      operationId: getDelivery
      parameters:
        - $ref: "#/components/parameters/DeliveryID"
      responses:
        "200":
          description: Delivery detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/deliveries/{deliveryID}/build:
    post:
      tags: [delivery]
      summary: Build or rebuild the delivery packages
      description: |
        Requires `projects.payment_status = 'paid'`. Returns 202 and queues the
        build; a rebuild increments `build_version` and keeps the previous
        version's objects for support.
      operationId: buildDelivery
      parameters:
        - $ref: "#/components/parameters/DeliveryID"
      responses:
        "202":
          description: Build queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: payment_required, round_not_approved or build_in_progress
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          $ref: "#/components/responses/Gone"

  /api/v1/deliveries/{deliveryID}/items:
    get:
      tags: [delivery]
      summary: Page the delivery item snapshots
      operationId: listDeliveryItems
      parameters:
        - $ref: "#/components/parameters/DeliveryID"
        - name: web_status
          in: query
          schema:
            type: string
            enum: [pending, ready, skipped]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Items ordered by position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryItemsPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/deliveries/{deliveryID}/tokens:
    get:
      tags: [delivery]
      summary: List download tokens without plaintext or hash
      operationId: listDeliveryTokens
      parameters:
        - $ref: "#/components/parameters/DeliveryID"
      responses:
        "200":
          description: Tokens newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeliveryToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [delivery]
      summary: Issue a download link
      description: |
        Requires a `ready` delivery and a paid balance. The plaintext token is
        returned once; only its SHA-256 is stored. Older links stay valid until
        they expire or are revoked.
      operationId: issueDeliveryToken
      parameters:
        - $ref: "#/components/parameters/DeliveryID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueDownloadTokenRequest"
      responses:
        "201":
          description: Issued link (plaintext shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryTokenIssued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: payment_required, round_not_approved or delivery_not_ready
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/deliveries/{deliveryID}/tokens/{tokenID}/revoke:
    post:
      tags: [delivery]
      summary: Revoke one download link
      description: Idempotent; the link stops working on the next customer request.
      operationId: revokeDeliveryToken
      parameters:
        - $ref: "#/components/parameters/DeliveryID"
        - $ref: "#/components/parameters/DownloadTokenID"
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/deliveries/{deliveryID}/tokens/revoke-all:
    post:
      tags: [delivery]
      summary: Revoke every active link of the delivery
      operationId: revokeAllDeliveryTokens
      parameters:
        - $ref: "#/components/parameters/DeliveryID"
      responses:
        "200":
          description: Number of revoked links
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/deliveries/{deliveryID}/notify:
    post:
      tags: [delivery]
      summary: Email the customer a new download link
      description: |
        Issues a token and queues the delivery mail. The plaintext link only
        exists in the message body and is cleared after a successful send. The
        response never includes the link.
      operationId: notifyDeliveryCustomer
      parameters:
        - $ref: "#/components/parameters/DeliveryID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifyDeliveryRequest"
      responses:
        "202":
          description: Mail queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryNotifyResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: payment_required, delivery_not_ready, client_email_missing or channel_unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          $ref: "#/components/responses/Gone"

  /g/v1/delivery/session:
    post:
      tags: [delivery]
      summary: Exchange a delivery link for a customer session
      description: |
        Public endpoint: the token comes from the URL fragment (`/#/d/<token>`),
        never from a query string. Returns a 30m bearer session capped at the
        token expiry. Every later request re-checks the token, the delivery and
        the project payment, so a refund or revocation takes effect immediately.
        Errors: 401 invalid_link, 409 payment_required/delivery_not_ready,
        410 link_expired/link_revoked/delivery_archived/delivery_cancelled,
        429 rate_limited.
      operationId: createDeliverySession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliverySessionRequest"
      responses:
        "201":
          description: Session plus delivery summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverySessionView"
        "401":
          description: invalid_link
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: payment_required or delivery_not_ready
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: link_expired, link_revoked, delivery_archived or delivery_cancelled
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    get:
      tags: [delivery]
      summary: Refresh the delivery summary
      security:
        - deliverySession: []
      operationId: getDeliverySession
      responses:
        "200":
          description: Re-checked delivery summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDelivery"
        "401":
          description: invalid_session or session_expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: payment_required or delivery_not_ready
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          $ref: "#/components/responses/Gone"

  /g/v1/delivery/items:
    get:
      tags: [delivery]
      summary: Page the delivered files
      description: |
        File names, web availability and short-lived thumbnail URLs. Original
        object URLs are never part of this list; a download grant is required.
      security:
        - deliverySession: []
      operationId: listCustomerDeliveryItems
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 40
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Item page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDeliveryItemsPage"
        "401":
          description: invalid_session or session_expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"

  /g/v1/delivery/downloads:
    post:
      tags: [delivery]
      summary: Grant a presigned download URL
      description: |
        Either a package id or an item id plus spec. Each grant consumes one
        download from the token; the URL expires after the configured presign
        TTL (5 minutes by default).
      security:
        - deliverySession: []
      operationId: createDeliveryDownload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryDownloadRequest"
      responses:
        "201":
          description: Presigned URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDownloadGrant"
        "401":
          description: invalid_session or session_expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: delivery_mismatch
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: downloads_exhausted, payment_required or web_spec_unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/archives:
    get:
      tags: [archive]
      summary: List project archives
      operationId: listArchives
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, verifying, ready, failed, deleting, deleted]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Archive page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveListPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      tags: [archive]
      summary: Create (or return) the archive of an archived project
      description: |
        The project must be in the `archived` state. Repeated calls return the
        existing row; verification is queued once and runs object by object.
      operationId: createArchive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArchiveRequest"
      responses:
        "201":
          description: Archive created and verification queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveSummary"
        "200":
          description: Existing archive returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: project_not_archived
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/archives/{archiveID}:
    get:
      tags: [archive]
      summary: Archive detail with the first snapshot page
      operationId: getArchive
      parameters:
        - $ref: "#/components/parameters/ArchiveID"
      responses:
        "200":
          description: Archive detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/archives/{archiveID}/items:
    get:
      tags: [archive]
      summary: Page the snapshot objects and their verification result
      operationId: listArchiveItems
      parameters:
        - $ref: "#/components/parameters/ArchiveID"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, verified, missing, mismatch, deleted]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Snapshot page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveItemsPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/archives/{archiveID}/verify:
    post:
      tags: [archive]
      summary: Retry the verification of a failed archive
      description: |
        Only a failed archive can be retried. Verified objects stay verified and
        only missing/mismatched objects are hashed again.
      operationId: retryArchiveVerification
      parameters:
        - $ref: "#/components/parameters/ArchiveID"
      responses:
        "202":
          description: Verification queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: verify_not_allowed or project_not_archived
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/archives/{archiveID}/deletion:
    post:
      tags: [archive]
      summary: Owner-approved deletion of the archived objects
      description: |
        Requires the owner role, the exact confirmation `DELETE` and a reason.
        Objects are deleted one by one; the archive row, project, contracts,
        invoices and the audit trail are kept as a tombstone.
      operationId: requestArchiveDeletion
      parameters:
        - $ref: "#/components/parameters/ArchiveID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveDeletionRequest"
      responses:
        "202":
          description: Deletion queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: deletion_not_allowed or project_not_archived
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/retention-policy:
    get:
      tags: [archive]
      summary: Read the tenant retention policy
      operationId: getRetentionPolicy
      responses:
        "200":
          description: Retention policy (defaults when never saved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [archive]
      summary: Update the tenant retention policy
      description: |
        Owner only. The policy is snapshotted onto new archives; existing
        archives keep the values recorded at creation time.
      operationId: updateRetentionPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionPolicyRequest"
      responses:
        "200":
          description: Saved policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    gallerySession:
      type: http
      scheme: bearer
      description: |
        Short-lived customer session (2h) issued by `POST /g/v1/session` from a
        share token. It is not a staff JWT: staff endpoints reject it. The
        server re-checks the token and album on every request, so revoking
        either takes effect immediately.
    proofSession:
      type: http
      scheme: bearer
      description: |
        Short-lived customer session (4h by default) issued by
        `POST /g/v1/proof/session` from a proof round token. It is a separate
        issuer from staff JWTs and selection sessions. The server re-checks the
        round, gallery and token on every request, so revoking either takes
        effect immediately.
    deliverySession:
      type: http
      scheme: bearer
      description: |
        Short-lived customer session (30m, capped at the token expiry) issued
        by `POST /g/v1/delivery/session` from a download link. It is a fourth
        issuer (`pwf-delivery`) separate from staff, selection and proof JWTs.
        Every request re-checks the token, the ready delivery, the approved
        round and the paid balance, so refunds and revocations take effect
        immediately.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated unique key (UUID recommended). Replaying the same key
        with the same body returns the stored response; the same key with a
        different body returns 409 idempotency_conflict, and a concurrent
        duplicate returns 409 idempotency_in_progress.
      schema:
        type: string
        minLength: 8
        maxLength: 200
    ProjectID:
      name: projectID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BatchID:
      name: batchID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetID:
      name: assetID
      in: path
      required: true
      schema:

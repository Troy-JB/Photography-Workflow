  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated but the role is not allowed on this resource
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found in this tenant
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Version conflict or closed resource
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: Validation or business rule failure
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: |
        The share link, album or session is no longer valid
        (`expired`, `revoked`, `gallery_expired`, `gallery_revoked`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limited (customer API) or share-token visit cap reached
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        request_id:
          type: string

    RegisterRequest:
      type: object
      required: [name, email, password, tenant_name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        tenant_name:
          type: string
          minLength: 1
          maxLength: 120

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        tenant_slug:
          type: string
          description: Required when the user belongs to more than one tenant

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string

    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string

    Profile:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        tenant:
          $ref: "#/components/schemas/Tenant"
        role:
          type: string
          enum: [owner, staff, retoucher, assistant]

    Session:
      type: object
      properties:
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
        tenant:
          $ref: "#/components/schemas/Tenant"
        role:
          type: string
          enum: [owner, staff, retoucher, assistant]

    ProjectState:
      type: string
      description: |
        Order lifecycle only. Payment, contract, asset and proof states are
        tracked on their own aggregates; this enum never mirrors them.
      enum:
        - draft
        - quoted
        - contract_pending
        - contracted
        - booked
        - shooting
        - post_production
        - completed
        - archived
        - on_hold
        - cancelled

    ContractStatus:
      type: string
      enum: [none, draft, rendered, sent, signing, signed, void]

    PaymentStatus:
      type: string
      description: |
        Core dues are `total_amount_cents` (deposit, balance and full orders);
        change dues are the sum of applied change orders. `change_pending` means
        the core contract is settled but a signed amendment is still unpaid;
        `paid` means both are settled.
      enum: [unpaid, deposit_pending, deposit_paid, balance_pending, change_pending, paid]

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        title:
          type: string
        client_id:
          type: string
          format: uuid
          nullable: true
        state:
          $ref: "#/components/schemas/ProjectState"
        contract_status:
          $ref: "#/components/schemas/ContractStatus"
        payment_status:
          $ref: "#/components/schemas/PaymentStatus"
        shoot_start_at:
          type: string
          format: date-time
          nullable: true
        shoot_end_at:
          type: string
          format: date-time
          nullable: true
        currency:
          type: string
          minLength: 3
          maxLength: 3
        total_amount_cents:
          type: integer
          format: int64
        deposit_cents:
          type: integer
          format: int64
        balance_cents:
          type: integer
          format: int64
        change_amount_cents:
          type: integer
          format: int64
          description: |
            Sum of applied change orders. Projected from the change-order
            aggregate; never written by payment or project code.
        selection_deadline:
          type: string
          format: date
          nullable: true
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateProjectRequest:
      type: object
      required: [title]
      properties:
        code:
          type: string
          description: Generated as P<yymmdd>-<hex> when omitted
        title:
          type: string
        client_id:
          type: string
          format: uuid
          nullable: true
        shoot_start_at:
          type: string
          format: date-time
          nullable: true
        shoot_end_at:
          type: string
          format: date-time
          nullable: true
        currency:
          type: string
          default: CNY
        total_amount_cents:
          type: integer
          format: int64
          minimum: 0
        deposit_cents:
          type: integer
          format: int64
          minimum: 0
        balance_cents:
          type: integer
          format: int64
          minimum: 0
        selection_deadline:
          type: string
          format: date
          nullable: true

    TransitionRequest:
      type: object
      required: [to, expected_version]
      properties:
        to:
          $ref: "#/components/schemas/ProjectState"
        expected_version:
          type: integer
          minimum: 1
          description: |
            Version observed by the caller. Required; a stale value returns
            409 version_conflict. Forward moves follow the lifecycle, active
            orders may enter on_hold/cancelled, and on_hold may only return to
            the interrupted state.
        reason:
          type: string
          description: Required when moving to cancelled or on_hold

    ProjectList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Batch:
